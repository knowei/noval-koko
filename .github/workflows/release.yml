name: release

# 触发方式：
#   1) 推一个 v* tag（推荐）：git tag v0.1.0 && git push origin v0.1.0
#   2) 手动：Actions 页面 → release → Run workflow（只上传 artifact，不发 Release）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# softprops/action-gh-release 往 Release 里传文件需要 contents: write
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    name: build apk
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # channel: stable 即可满足 pubspec 的 sdk: ^3.13.0；
      # 若上游 stable 落后于项目要求，把 channel 换成 beta 或加 flutter-version: 'x.y.z'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test（单元 + 假站点端到端，不联网）
        run: flutter test

      - name: flutter build apk --release
        run: flutter build apk --release

      - name: Collect artifact
        run: |
          mkdir -p dist
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -f "$APK"
          NAME="noval-${GITHUB_REF_NAME//\//-}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then NAME="noval-manual-${GITHUB_RUN_NUMBER}"; fi
          cp "$APK" "dist/${NAME}.apk"
          cp "$APK" dist/noval-latest.apk
          ls -lh dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: noval-apk
          path: dist/*.apk
          if-no-files-found: error

      # 只有打 tag 时才发 Release；workflow_dispatch 只留 artifact
      - name: Publish to Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 想用正式签名：把 keystore 的 base64 存成 secret KEYSTORE_BASE64，
      # 再加 KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD，
      # 在 build 之前解码成 android/app/upload.jks 并改写 signingConfigs。
      # 不配也行：Flutter 模板的 release 默认用 debug key 签名（自己装来用足够了）。
