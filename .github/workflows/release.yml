name: release

# 触发方式：
#   1) 推一个 v* tag（推荐）：git tag v0.2.0 && git push origin v0.2.0
#   2) 手动：Actions 页面 → release → Run workflow（只上传 artifact，不发 Release）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# softprops/action-gh-release 往 Release 里传文件需要 contents: write
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    name: build apk（split-per-abi）
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # 签名材料只从 Secrets 注入（仓库里已移除私钥，见 .gitignore）。
    # 必须是**同一个** keystore：换钥匙会导致老安装无法覆盖升级。
    # 四个 Secrets：ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
    env:
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # channel: stable 即可满足 pubspec 的 sdk: ^3.13.0；
      # 若上游 stable 落后于项目要求，把 channel 换成 beta 或加 flutter-version: 'x.y.z'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      # 版本号从 pubspec 同步到 lib/src/core/version.dart（App 内更新用它比对 tag）
      - name: 生成 version.dart
        run: dart run tool/gen_version.dart

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test（单元 + 假站点端到端，不联网）
        run: flutter test

      # keystore 从 Secrets 还原（私钥不进仓库）
      - name: 准备签名材料（从 Secrets 还原 keystore）
        if: env.ANDROID_KEYSTORE_B64 != ''
        working-directory: android
        run: |
          set -e
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > app/noval-release.jks
          cat > key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=noval-release.jks
          EOF
          echo "签名：使用 Secrets 注入的 keystore"

      # 仓库里已经没有私钥了：缺 Secrets 就必须失败，否则会静默用 debug key 签名，
      # 装出来的包和线上版本签名不一致，老用户无法覆盖升级。
      - name: 缺签名 Secrets 时直接失败
        if: env.ANDROID_KEYSTORE_B64 == ''
        run: |
          echo "::error::缺少 ANDROID_KEYSTORE_B64 等 Secrets，无法用固定 keystore 签名。"
          echo "请到 Settings → Secrets and variables → Actions 配齐四个 Secrets 后重跑。"
          exit 1

      # 按 ABI 拆分：单包 20~25MB，比通用包（60MB+）小一半以上
      - name: flutter build apk --release --split-per-abi
        run: flutter build apk --release --split-per-abi

      # 再出一个通用包：手机上分不清自己该装哪个时用它（装不错）
      - name: flutter build apk --release（universal）
        run: flutter build apk --release

      - name: Collect artifact
        run: |
          set -e
          mkdir -p dist
          VER="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then VER="0.0.0-manual-${GITHUB_RUN_NUMBER}"; fi
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            b=$(basename "$f" .apk)          # app-arm64-v8a-release
            abi=${b#app-}; abi=${abi%-release}
            cp "$f" "dist/noval-${VER}-${abi}.apk"
          done
          # App 内更新默认优先下载 arm64-v8a 这份
          cp "dist/noval-${VER}-arm64-v8a.apk" dist/noval-latest-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-release.apk "dist/noval-${VER}-universal.apk"
          ls -lh dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: noval-apk
          path: dist/*.apk
          if-no-files-found: error

      # 只有打 tag 时才发 Release；workflow_dispatch 只留 artifact
      # Release 正文就是 App 内更新弹窗显示的内容。
      # 自动生成的 notes 只有一串 PR 标题 + Full Changelog 链接，用户看不懂，
      # 所以优先用手写的 docs/release-notes/<tag>.md。
      - name: Prepare release notes
        if: github.ref_type == 'tag'
        run: |
          TAG="${GITHUB_REF_NAME}"
          SRC="docs/release-notes/${TAG}.md"
          if [ -f "$SRC" ]; then
            cp "$SRC" dist/release-notes.md
            echo "使用手写更新说明：$SRC"
          else
            printf '## %s\n\n· 细节见仓库提交记录\n' "$TAG" > dist/release-notes.md
            echo "未找到 $SRC，使用兜底说明"
          fi
          echo "--- dist/release-notes.md ---"
          cat dist/release-notes.md

      - name: Publish to Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          body_path: dist/release-notes.md
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    name: build windows（zip）
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: 生成 version.dart
        run: dart run tool/gen_version.dart

      - name: flutter build windows --release
        run: flutter build windows --release

      - name: Zip
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          if ("${{ github.ref_type }}" -ne "tag") { $ver = "manual-${{ github.run_number }}" }
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "noval-$ver-windows-x64.zip" -Force
          Get-ChildItem "noval-$ver-windows-x64.zip" | Select-Object Name, Length

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: noval-windows
          path: noval-*-windows-x64.zip
          if-no-files-found: error

      - name: Publish to Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: noval-*-windows-x64.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

