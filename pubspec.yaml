name: noval
description: "规则驱动的小说 + 漫画阅读器"
publish_to: 'none'
version: 0.7.0+7

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # 网络
  dio: ^5.9.0
  dio_cookie_manager: ^3.5.0
  cookie_jar: ^4.0.8

  # JS 引擎（QuickJS）
  flutter_js: ^0.8.7

  # 解析
  html: ^0.15.7

  # 编码识别
  charset: ^2.0.1

  # 加解密（书源 JS 里的 md5/base64 等）
  crypto: ^3.0.7

  # 存储
  sqflite: ^2.4.5
  sqflite_common_ffi: ^2.4.5
  path: ^1.9.0
  path_provider: ^2.1.6

  # 状态
  provider: ^6.1.5

  # UI
  cached_network_image: ^4.0.5
  file_picker: ^13.1.0
  archive: ^4.5.2
  flutter_inappwebview: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
